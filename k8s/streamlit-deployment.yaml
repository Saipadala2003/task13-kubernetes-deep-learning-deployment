apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-ui
  namespace: task13
  labels:
    app: streamlit-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit-ui
  template:
    metadata:
      labels:
        app: streamlit-ui
    spec:
      containers:
        - name: streamlit-ui
          image: task11-streamlit-ui:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8501
          env:
            - name: FLASK_API_URL
              value: "http://flask-api:5000"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
